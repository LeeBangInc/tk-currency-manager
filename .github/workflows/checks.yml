name: Checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['7.4', '8.2', '8.4']
    steps:
      - uses: actions/checkout@v4
      - run: docker run --rm --network none -v "$PWD:/plugin:ro" -w /plugin php:${{ matrix.php }}-cli sh bin/check.sh
      - run: node --check assets/admin.js
      - run: bash bin/build.sh
  integration:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - wordpress: '7.1.3'
            woocommerce: '11.2.1'
          - wordpress: '6.8.3'
            woocommerce: '10.3.5'
    steps:
      - uses: actions/checkout@v4
      - run: bash bin/test-integration.sh
        env:
          TKCM_WP_VERSION: ${{ matrix.wordpress }}
          TKCM_WC_VERSION: ${{ matrix.woocommerce }}
